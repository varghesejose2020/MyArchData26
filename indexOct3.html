<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priests Directory — Archdiocese of Changanacherry</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --maroon:#7a1f2b;
  --maroon-deep:#5c161f;
  --gold:#b8860b;
  --gold-soft:#d9b96a;
  --forest:#35524a;
  --parchment:#f6f1e6;
  --card:#fffdf9;
  --ink:#2b2420;
  --ink-soft:#6b6154;
  --hairline:#e4dac6;
  --rose:#a83a4a;
  --radius:14px;
  --shadow:0 1px 2px rgba(43,36,32,.04),0 8px 24px rgba(43,36,32,.07);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 50% -10%,#fbf6ea 0%,var(--parchment) 55%),
    var(--parchment);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* HEADER */

header{
  position:relative;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  max-width:1240px;
  margin:auto;
  padding:18px clamp(16px,4vw,40px);
  border-bottom:1px solid var(--hairline);
  flex-wrap:wrap;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo-container img{
  width:48px;
  height:48px;
  object-fit:contain;
  border-radius:50%;
  box-shadow:var(--shadow);
  background:#fff;
  padding:5px;
  display:block;
}

.brand-text{
  text-align:left;
  line-height:1.25;
}

.eyebrow{
  margin:0;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:600;
}

.brand-name{
  margin:1px 0 0;
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-size:18px;
  color:var(--maroon-deep);
}

.header-title{
  text-align:center;
  padding:30px 20px 26px;
}

h1{
  margin:0;
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-size:clamp(30px,5vw,44px);
  color:var(--maroon-deep);
}

.rule{
  width:84px;
  height:3px;
  margin:16px auto 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  border-radius:2px;
}

/* MAIN STATUS TABS */

.tabs{
  display:flex;
  gap:6px;
  flex-shrink:0;
  flex-wrap:wrap;
  justify-content:center;
}

.tab-btn{
  font-family:'Inter',sans-serif;
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.03em;
  color:var(--ink-soft);
  background:var(--card);
  border:1px solid var(--hairline);
  padding:8px 16px;
  border-radius:999px;
  cursor:pointer;
  transition:all .18s ease;
  white-space:nowrap;
}

.tab-btn:hover{
  color:var(--maroon);
  border-color:var(--gold-soft);
}

.tab-btn.active{
  background:var(--maroon);
  border-color:var(--maroon);
  color:#fff;
  box-shadow:var(--shadow);
}

.tab-panel{
  display:none;
}

.tab-panel.active{
  display:block;
}

/* STATUS NAVIGATION */

.status-tabs{
  max-width:1000px;
  margin:0 auto;
  padding:18px clamp(16px,4vw,40px) 4px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.status-btn{
  min-width:125px;
  padding:11px 18px;
  border-radius:999px;
  border:1px solid var(--hairline);
  background:rgba(255,253,249,.9);
  color:var(--ink-soft);
  font-family:'Inter',sans-serif;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:.18s ease;
}

.status-btn:hover{
  border-color:var(--gold-soft);
  color:var(--maroon);
}

.status-btn.active{
  background:var(--maroon);
  border-color:var(--maroon);
  color:#fff;
}

.status-btn .status-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  padding:0 6px;
  margin-left:5px;
  border-radius:999px;
  background:rgba(0,0,0,.08);
}

.status-btn.active .status-number{
  background:rgba(255,255,255,.2);
}

.status-btn.demised-active{
  color:var(--rose);
}

.status-btn.demised-active.active{
  background:var(--rose);
  border-color:var(--rose);
  color:#fff;
}

/* SEARCH */

.toolbar{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(246,241,230,.92);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border-bottom:1px solid var(--hairline);
}

.controls{
  max-width:720px;
  margin:0 auto;
  padding:14px clamp(16px,4vw,40px);
  display:flex;
  align-items:center;
  gap:14px;
}

.search-bar{
  display:block;
  flex:1;
  min-width:0;
  padding:12px 20px;
  border-radius:999px;
  border:1.5px solid var(--hairline);
  background:var(--card);
  font-family:'Inter',sans-serif;
  font-size:15px;
  color:var(--ink);
  box-shadow:var(--shadow);
}

.search-bar::placeholder{
  color:#a89b85;
}

.search-bar:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(184,134,11,.14),var(--shadow);
}

.priest-count{
  flex-shrink:0;
  margin:0;
  padding:7px 14px;
  border-radius:999px;
  background:rgba(53,82,74,.1);
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-weight:600;
  color:var(--forest);
  white-space:nowrap;
}

/* RECENT */

.spotlight-wrap{
  max-width:1240px;
  margin:30px auto 0;
  padding:0 clamp(16px,4vw,40px);
}

.spotlight-heading{
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--maroon);
  font-weight:700;
  margin:0 0 12px;
}

.spotlight-strip{
  display:flex;
  justify-content:center;
}

.spotlight-card{
  width:100%;
  max-width:380px;
  background:linear-gradient(135deg,var(--maroon-deep),var(--maroon) 65%,#8a2532);
  border-radius:var(--radius);
  padding:20px 22px;
  display:flex;
  gap:16px;
  align-items:center;
  box-shadow:0 10px 26px rgba(90,20,25,.26);
  position:relative;
  overflow:hidden;
  transition:opacity .35s ease,transform .35s ease;
}

.spotlight-card.fade-out{
  opacity:0;
  transform:translateY(4px);
}

.spotlight-card::after{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(180px 180px at 100% 0%,rgba(217,185,106,.22),transparent 70%);
  pointer-events:none;
}

.spotlight-card img{
  width:58px;
  height:74px;
  object-fit:cover;
  border-radius:8px;
  border:2px solid rgba(217,185,106,.55);
  flex-shrink:0;
}

.spotlight-card-text{
  min-width:0;
}

.spotlight-card-name{
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-size:19px;
  color:#fff;
  margin:0 0 3px;
  line-height:1.2;
}

.spotlight-card-meta{
  font-size:12.5px;
  color:#f2e6d3;
  margin:0;
}

.spotlight-card-date{
  font-size:11px;
  color:var(--gold-soft);
  font-weight:600;
  margin-top:5px;
}

.spotlight-dots{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:12px;
}

.spotlight-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--hairline);
}

.spotlight-dot.active{
  background:var(--maroon);
  transform:scale(1.3);
}

/* DIRECTORY GRID */

#priests-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:22px;
  padding:24px clamp(16px,4vw,40px) 80px;
  max-width:1240px;
  margin:auto;
  list-style:none;
}

.priest-item{
  background:var(--card);
  border:1px solid var(--hairline);
  border-radius:var(--radius);
  padding:18px;
  display:flex;
  gap:14px;
  box-shadow:var(--shadow);
  position:relative;
  transition:transform .18s ease,box-shadow .18s ease;
}

.priest-item:hover{
  transform:translateY(-3px);
  box-shadow:0 4px 8px rgba(43,36,32,.05),0 16px 32px rgba(43,36,32,.1);
}

.priest-item img{
  width:74px;
  height:92px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid var(--hairline);
  flex-shrink:0;
}

.priest-info{
  flex:1;
  min-width:0;
}

.priest-item h3{
  margin:0 0 2px;
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-size:20px;
  color:var(--ink);
  line-height:1.2;
}

.nickname{
  margin:0 0 6px;
  font-size:12.5px;
  font-style:italic;
  color:var(--ink-soft);
}

/* STATUS BADGE */

.status-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:6px;
  padding:3px 9px;
  border-radius:999px;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
}

.status-badge.active{
  background:rgba(53,82,74,.11);
  color:var(--forest);
}

.status-badge.retired{
  background:rgba(184,134,11,.13);
  color:#86620a;
}

.status-badge.demised{
  background:rgba(168,58,74,.11);
  color:var(--rose);
}

/* MINISTRY */

.ministry-block{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--hairline);
}

.designation{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--maroon);
  font-weight:600;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.03em;
}

.parish{
  color:var(--forest);
  font-size:13.5px;
  margin-top:2px;
}

.forane{
  display:inline-block;
  background:rgba(53,82,74,.1);
  color:var(--forest);
  padding:2px 9px;
  border-radius:6px;
  font-size:10.5px;
  font-weight:600;
  margin-top:6px;
}

.appointment-date{
  font-size:11.5px;
  color:var(--ink-soft);
  margin-top:6px;
  font-weight:500;
}

/* HOME PARISH */

.home-parish{
  margin-top:11px;
  padding:9px 11px;
  border-radius:9px;
  background:#faf6eb;
  border:1px solid var(--hairline);
}

.home-parish-label{
  font-size:9.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:700;
}

.home-parish-value{
  font-size:12.5px;
  color:var(--forest);
  margin-top:3px;
  line-height:1.4;
}

/* RECENT APPOINTMENT */

.recent-appointment{
  border-color:var(--gold-soft);
}

.recent-appointment::before{
  content:'';
  position:absolute;
  left:0;
  top:14px;
  bottom:14px;
  width:3px;
  border-radius:3px;
  background:linear-gradient(180deg,var(--gold),var(--maroon));
}

.seal{
  position:absolute;
  top:-10px;
  right:-8px;
  width:40px;
  height:40px;
  border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#c8940f,var(--maroon) 78%);
  box-shadow:0 3px 6px rgba(90,20,25,.35),inset 0 0 0 2px rgba(255,255,255,.15);
  transform:rotate(-9deg);
  display:flex;
  align-items:center;
  justify-content:center;
}

.seal::before{
  content:'+';
  color:#f8ecc9;
  font-family:'Cormorant Garamond',serif;
  font-size:20px;
  font-weight:700;
}

.seal-label{
  position:absolute;
  top:26px;
  right:-22px;
  font-size:8.5px;
  letter-spacing:.08em;
  color:var(--maroon-deep);
  font-weight:700;
  text-transform:uppercase;
  transform:rotate(-9deg);
}

/* DEMISED CARD */

.demised-card{
  border-color:#e5c3c9;
  background:linear-gradient(135deg,#fffdf9,#fff8f8);
}

.demised-card::before{
  content:'';
  position:absolute;
  left:0;
  top:14px;
  bottom:14px;
  width:3px;
  border-radius:3px;
  background:linear-gradient(180deg,var(--rose),#d49aa3);
}

.demised-flower{
  position:absolute;
  right:14px;
  top:12px;
  width:40px;
  height:40px;
  border-radius:50%;
  background:radial-gradient(circle,#b83c51 0 18%,#8e2638 20% 42%,#d38a96 44% 52%,#8e2638 54% 100%);
  box-shadow:0 3px 8px rgba(120,30,45,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff2f2;
  font-size:19px;
}

.demised-flower::after{
  content:'✝';
  position:absolute;
  font-size:13px;
  color:#fff;
  opacity:.9;
}

/* DEMISED DETAILS */

.demised-details{
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid #ead2d5;
  display:grid;
  gap:7px;
}

.detail-row{
  display:flex;
  gap:7px;
  align-items:baseline;
  font-size:12px;
}

.detail-label{
  min-width:75px;
  color:var(--ink-soft);
  font-weight:600;
}

.detail-value{
  color:var(--ink);
  font-weight:500;
}

.death-value{
  color:var(--rose);
  font-weight:700;
}

/* EMPTY */

.empty-state{
  grid-column:1/-1;
  text-align:center;
  padding:55px 20px;
  color:var(--ink-soft);
}

.empty-state-icon{
  font-size:34px;
  margin-bottom:8px;
  color:var(--gold);
}

.empty-state h3{
  font-family:'Cormorant Garamond',serif;
  font-size:24px;
  color:var(--maroon-deep);
  margin:0 0 5px;
}

.empty-state p{
  margin:0;
  font-size:13px;
}

/* TIMELINE */

#timeline-list{
  max-width:860px;
  margin:0 auto;
  padding:20px clamp(16px,4vw,40px) 80px;
  list-style:none;
}

.timeline-person{
  background:var(--card);
  border:1px solid var(--hairline);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px 22px;
  margin-bottom:18px;
  display:flex;
  gap:16px;
}

.timeline-person img{
  width:56px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid var(--hairline);
  flex-shrink:0;
}

.timeline-person-name{
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-size:19px;
  margin:0 0 12px;
  color:var(--ink);
}

.timeline-track{
  position:relative;
  padding-left:22px;
}

.timeline-track::before{
  content:'';
  position:absolute;
  left:5px;
  top:6px;
  bottom:6px;
  width:2px;
  background:var(--hairline);
}

.timeline-entry{
  position:relative;
  padding-bottom:16px;
}

.timeline-entry:last-child{
  padding-bottom:0;
}

.timeline-entry::before{
  content:'';
  position:absolute;
  left:-22px;
  top:4px;
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--card);
  border:2px solid var(--hairline);
}

.timeline-entry.is-current::before{
  border-color:var(--gold);
  background:var(--gold);
  box-shadow:0 0 0 3px rgba(184,134,11,.15);
}

.timeline-entry-designation{
  font-size:13px;
  font-weight:600;
  color:var(--maroon);
}

.timeline-current-tag{
  font-size:9.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  font-weight:700;
  color:var(--gold);
  border:1px solid var(--gold-soft);
  padding:1px 7px;
  border-radius:999px;
  margin-left:5px;
}

.timeline-entry-parish{
  font-size:13.5px;
  color:var(--forest);
  margin-top:2px;
}

.timeline-entry-dates{
  font-size:11.5px;
  color:var(--ink-soft);
  margin-top:3px;
}

.timeline-empty-notice{
  max-width:640px;
  margin:40px auto;
  padding:20px 24px;
  text-align:center;
  background:var(--card);
  border:1px dashed var(--hairline);
  border-radius:var(--radius);
  color:var(--ink-soft);
  font-size:13.5px;
  line-height:1.6;
}

#loading-message{
  text-align:center;
  margin:60px 20px;
  font-size:15px;
  color:var(--ink-soft);
}

/* MOBILE */

@media(max-width:560px){

  .header-top{
    justify-content:center;
  }

  .brand{
    flex:1 1 100%;
    justify-content:center;
  }

  .tabs{
    flex:1 1 100%;
  }

  .status-tabs{
    padding-top:14px;
  }

  .status-btn{
    min-width:100px;
    padding:9px 12px;
  }
}

@media(max-width:520px){

  .controls{
    flex-wrap:wrap;
  }

  .search-bar{
    order:1;
    flex-basis:100%;
  }

  .priest-count{
    order:2;
    margin:0 auto;
  }
}

@media(max-width:420px){

  .priest-item{
    padding:14px;
    gap:10px;
  }

  .priest-item img{
    width:62px;
    height:78px;
  }

  .demised-flower{
    right:9px;
    top:9px;
    width:34px;
    height:34px;
  }

  .timeline-person{
    padding:15px;
    gap:10px;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-top">

    <div class="brand">

      <div class="logo-container">
        <img
          src="https://www.archdiocesechanganacherry.org//images/Arch_Logo.jpeg"
          alt="Archdiocese logo">
      </div>

      <div class="brand-text">
        <p class="eyebrow">Archdiocese of</p>
        <p class="brand-name">Changanacherry</p>
      </div>

    </div>

    <div class="tabs">

      <button
        class="tab-btn active"
        id="tab-btn-directory"
        onclick="switchMainTab('directory')">
        Directory
      </button>

      <button
        class="tab-btn"
        id="tab-btn-timeline"
        onclick="switchMainTab('timeline')">
        Priest Timeline
      </button>

    </div>

  </div>

  <div class="header-title">
    <h1>Priests Directory</h1>
    <div class="rule"></div>
  </div>

</header>


<!-- DIRECTORY -->

<div id="tab-directory" class="tab-panel active">

  <div class="status-tabs">

    <button
      class="status-btn active"
      id="status-btn-active"
      onclick="switchStatus('Active')">
      Active
      <span class="status-number" id="count-active">0</span>
    </button>

    <button
      class="status-btn"
      id="status-btn-retired"
      onclick="switchStatus('Retired')">
      Retired
      <span class="status-number" id="count-retired">0</span>
    </button>

    <button
      class="status-btn"
      id="status-btn-demised"
      onclick="switchStatus('Demised')">
      ✝ Demised
      <span class="status-number" id="count-demised">0</span>
    </button>

  </div>


  <!-- RECENTLY JOINED -->

  <div
    id="spotlight-wrap"
    class="spotlight-wrap"
    style="display:none;">

    <p class="spotlight-heading">
      Recently Joined
    </p>

    <div class="spotlight-strip">

      <div
        class="spotlight-card"
        id="spotlight-card">
      </div>

    </div>

    <div
      class="spotlight-dots"
      id="spotlight-dots">
    </div>

  </div>


  <!-- SEARCH -->

  <div class="toolbar">

    <div class="controls">

      <input
        type="text"
        id="search-bar"
        class="search-bar"
        placeholder="Search by name, home parish, parish, forane…"
        oninput="filterPriests()">

      <p
        id="priest-count"
        class="priest-count">
        Total: 0
      </p>

    </div>

  </div>


  <ul id="priests-list"></ul>

</div>


<!-- TIMELINE -->

<div id="tab-timeline" class="tab-panel">

  <div class="toolbar">

    <div class="controls">

      <input
        type="text"
        id="timeline-search-bar"
        class="search-bar"
        placeholder="Search by priest name or home parish…"
        oninput="filterTimeline()">

    </div>

  </div>

  <ul id="timeline-list"></ul>

</div>


<div id="loading-message">
  Loading directory…
</div>


<script>

const jsonUrl = 'priests.json';
const parishUrl = 'parishes.json';

let allPriests = [];
let currentStatus = 'Active';

const listEl = document.getElementById('priests-list');
const countEl = document.getElementById('priest-count');
const loadingEl = document.getElementById('loading-message');


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(str){

  return (str || '')
    .replace(/’/g,"'")
    .replace(/[^a-z0-9\s]/gi,'')
    .toLowerCase()
    .trim();

}


/* =========================================================
   STATUS NORMALIZATION
========================================================= */

function normalizeStatus(status){

  const value = normalize(status);

  if(value === 'active'){
    return 'Active';
  }

  if(
    value === 'retired' ||
    value === 'retiered' ||
    value === 'retire'
  ){
    return 'Retired';
  }

  if(
    value === 'demised' ||
    value === 'deceased' ||
    value === 'dead'
  ){
    return 'Demised';
  }

  return 'Active';

}


/* =========================================================
   PHOTO
========================================================= */

function fixPhoto(url){

  if(!url){
    return 'https://myparish.archeparchybookkeeping.org/resources/img/default_icon.jpg';
  }

  if(url.startsWith('http')){
    return url;
  }

  return url.replace(
    /^\.\/?/,
    'https://myparish.archeparchybookkeeping.org/'
  );

}


/* =========================================================
   DATE
========================================================= */

function parseDate(dateStr){

  if(!dateStr){
    return null;
  }

  let d = new Date(dateStr);

  if(!isNaN(d)){
    return d;
  }

  /* Handle DD/MM/YYYY */

  const match = String(dateStr).match(
    /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
  );

  if(match){

    const day = Number(match[1]);
    const month = Number(match[2]) - 1;
    const year = Number(match[3]);

    d = new Date(year,month,day);

    if(!isNaN(d)){
      return d;
    }

  }

  return null;

}


function formatDate(dateStr){

  const d = parseDate(dateStr);

  if(!d){
    return '';
  }

  return d.toLocaleDateString(
    'en-GB',
    {
      day:'2-digit',
      month:'short',
      year:'numeric'
    }
  );

}


/* =========================================================
   RECENT APPOINTMENT
========================================================= */

function isRecent(dateStr){

  const d = parseDate(dateStr);

  if(!d){
    return false;
  }

  const now = new Date();

  const diffDays =
    (now - d) /
    (1000 * 60 * 60 * 24);

  return diffDays >= 0 && diffDays <= 30;

}


function getRecentAppointments(priests){

  const entries = [];

  priests.forEach(p => {

    let latest = null;

    p.ministries.forEach(m => {

      if(!m.join_date){
        return;
      }

      const d = parseDate(m.join_date);

      if(!d){
        return;
      }

      if(!latest || d > latest.date){

        latest = {
          ministry:m,
          date:d
        };

      }

    });

    if(
      latest &&
      isRecent(latest.ministry.join_date)
    ){

      entries.push({
        priest:p,
        ministry:latest.ministry,
        date:latest.date
      });

    }

  });

  entries.sort(
    (a,b) => b.date - a.date
  );

  return entries;

}


/* =========================================================
   HOME / NATIVE PARISH
========================================================= */

function getHomeParish(priest){

  const parish =
    String(priest.nativeparish || '').trim();

  const place =
    String(priest.nativeparishplace || '').trim();

  if(parish && place){
    return `${parish}, ${place}`;
  }

  return parish || place || '';

}


/* =========================================================
   SPOTLIGHT
========================================================= */

let spotlightEntries = [];
let spotlightIndex = 0;
let spotlightTimer = null;


function spotlightCardHtml(entry){

  const prefix =
    entry.ministry.name_prefix ||
    'Fr.';

  return `

    <img
      src="${fixPhoto(entry.priest.photo)}"
      alt="${entry.priest.name}">

    <div class="spotlight-card-text">

      <p class="spotlight-card-name">
        ${prefix} ${entry.priest.name}
      </p>

      <p class="spotlight-card-meta">
        ${entry.ministry.parish},
        ${entry.ministry.place}
      </p>

      <p class="spotlight-card-date">
        ${formatDate(entry.ministry.join_date)}
      </p>

    </div>

  `;

}


function showSpotlightCard(index){

  const cardEl =
    document.getElementById('spotlight-card');

  const dotsEl =
    document.getElementById('spotlight-dots');

  spotlightIndex = index;

  cardEl.classList.add('fade-out');

  setTimeout(() => {

    if(!spotlightEntries[spotlightIndex]){
      return;
    }

    cardEl.innerHTML =
      spotlightCardHtml(
        spotlightEntries[spotlightIndex]
      );

    cardEl.classList.remove('fade-out');

  },350);

  [...dotsEl.children].forEach(
    (dot,i) =>
      dot.classList.toggle(
        'active',
        i === index
      )
  );

}


function renderSpotlight(priests){

  const wrap =
    document.getElementById('spotlight-wrap');

  const dotsEl =
    document.getElementById('spotlight-dots');

  spotlightEntries =
    getRecentAppointments(priests);

  if(spotlightTimer){
    clearInterval(spotlightTimer);
  }

  if(spotlightEntries.length === 0){

    wrap.style.display = 'none';

    return;
  }

  dotsEl.innerHTML =
    spotlightEntries
      .map(() => `<div class="spotlight-dot"></div>`)
      .join('');

  document.getElementById(
    'spotlight-card'
  ).innerHTML =
    spotlightCardHtml(
      spotlightEntries[0]
    );

  [...dotsEl.children][0]
    ?.classList.add('active');

  spotlightIndex = 0;

  wrap.style.display = 'block';

  if(spotlightEntries.length > 1){

    spotlightTimer =
      setInterval(() => {

        showSpotlightCard(
          (spotlightIndex + 1) %
          spotlightEntries.length
        );

      },3200);

  }

}


/* =========================================================
   MAP MINISTRY
========================================================= */

function mapMinistry(m,isCurrent,parishes){

  const match =
    parishes.find(p =>

      normalize(p.parish_name) ===
      normalize(m.parish_name)

      &&

      normalize(p.parish_place) ===
      normalize(m.parish_place)

    );

  return {

    parish:
      m.parish_name || '',

    place:
      m.parish_place || '',

    designation:
      m.ministry_designation_name || '',

    forane:
      match ? match.forane_name : '',

    primary:
      m.is_primary_ministry == 1,

    name_prefix:
      m.name_prefix || '',

    join_date:
      m.join_date || '',

    end_date:
      m.end_date ||
      m.relieved_date ||
      m.left_date ||
      '',

    is_current:isCurrent

  };

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  try{

    const responses =
      await Promise.all([
        fetch(jsonUrl),
        fetch(parishUrl)
      ]);

    const priestsRes = responses[0];
    const parishesRes = responses[1];

    if(!priestsRes.ok){
      throw new Error(
        'Unable to load priests.json'
      );
    }

    const priestsJson =
      await priestsRes.json();

    let parishesJson = {
      data:[]
    };

    if(parishesRes.ok){

      try{
        parishesJson =
          await parishesRes.json();
      }catch(e){
        parishesJson = {
          data:[]
        };
      }

    }

    const parishes =
      Array.isArray(parishesJson.data)
        ? parishesJson.data
        : [];


    allPriests =
      (priestsJson.data || []).map(priest => {

        const ministries =
          (priest.current_ministry || [])
            .map(m =>
              mapMinistry(
                m,
                true,
                parishes
              )
            );


        const historySource =
          priest.previous_ministry ||
          priest.past_ministry ||
          priest.ministry_history ||
          [];


        const timelineHistory =
          Array.isArray(historySource)
            ? historySource.map(m =>
                mapMinistry(
                  m,
                  false,
                  parishes
                )
              )
            : [];


        const status =
          normalizeStatus(
            priest.status
          );


        return {

          name:
            priest.name || '',

          nickname:
            priest.nickname || '',

          photo:
            priest.photo || '',

          status:status,

          date_of_birth:
            priest.date_of_birth ||
            priest.dateofbirth ||
            '',

          date_of_ordination:
            priest.date_of_ordination ||
            priest.dateofordination ||
            '',

          demisedate:
            priest.demisedate || '',

          nativeparish:
            priest.nativeparish || '',

          nativeparishplace:
            priest.nativeparishplace || '',

          ministries:ministries,

          timeline:
            [...ministries,...timelineHistory]
              .sort((a,b) => {

                if(
                  a.is_current !==
                  b.is_current
                ){
                  return a.is_current
                    ? -1
                    : 1;
                }

                const da =
                  parseDate(a.join_date)
                  || new Date(0);

                const db =
                  parseDate(b.join_date)
                  || new Date(0);

                return db - da;

              })

        };

      });


    updateCounts();

    renderSpotlight(
      allPriests.filter(
        p => p.status === 'Active'
      )
    );

    displayCurrentStatus();

    renderTimeline(allPriests);

    loadingEl.style.display = 'none';

  }catch(error){

    console.error(error);

    loadingEl.innerHTML = `
      Unable to load the directory.
      Please check priests.json and parishes.json.
    `;

  }

}


/* =========================================================
   COUNTS
========================================================= */

function updateCounts(){

  const active =
    allPriests.filter(
      p => p.status === 'Active'
    ).length;

  const retired =
    allPriests.filter(
      p => p.status === 'Retired'
    ).length;

  const demised =
    allPriests.filter(
      p => p.status === 'Demised'
    ).length;


  document.getElementById(
    'count-active'
  ).textContent = active;

  document.getElementById(
    'count-retired'
  ).textContent = retired;

  document.getElementById(
    'count-demised'
  ).textContent = demised;

}


/* =========================================================
   STATUS SWITCH
========================================================= */

function switchStatus(status){

  currentStatus = status;

  document
    .getElementById('status-btn-active')
    .classList.toggle(
      'active',
      status === 'Active'
    );

  document
    .getElementById('status-btn-retired')
    .classList.toggle(
      'active',
      status === 'Retired'
    );

  document
    .getElementById('status-btn-demised')
    .classList.toggle(
      'active',
      status === 'Demised'
    );


  const search =
    document.getElementById(
      'search-bar'
    );

  search.value = '';

  if(status === 'Demised'){

    search.placeholder =
      'Search by name or home parish…';

  }else{

    search.placeholder =
      'Search by name, home parish, parish, forane…';

  }


  const spotlight =
    document.getElementById(
      'spotlight-wrap'
    );

  if(status === 'Active'){

    renderSpotlight(
      allPriests.filter(
        p => p.status === 'Active'
      )
    );

  }else{

    spotlight.style.display = 'none';

  }


  displayCurrentStatus();

}


/* =========================================================
   DISPLAY CURRENT STATUS
========================================================= */

function displayCurrentStatus(){

  const query =
    normalize(
      document.getElementById(
        'search-bar'
      ).value
    );


  let priests =
    allPriests.filter(
      p => p.status === currentStatus
    );


  if(query){

    priests =
      priests.filter(
        p => priestMatchesSearch(
          p,
          query
        )
      );

  }


  display(priests);

}


/* =========================================================
   SEARCH
========================================================= */

function priestMatchesSearch(p,q){

  if(
    normalize(p.name).includes(q)
  ){
    return true;
  }

  if(
    normalize(p.nickname).includes(q)
  ){
    return true;
  }

  if(
    normalize(p.nativeparish).includes(q)
  ){
    return true;
  }

  if(
    normalize(p.nativeparishplace).includes(q)
  ){
    return true;
  }

  if(
    normalize(
      getHomeParish(p)
    ).includes(q)
  ){
    return true;
  }


  return p.ministries.some(m =>

    normalize(m.parish).includes(q) ||

    normalize(m.place).includes(q) ||

    normalize(m.designation).includes(q) ||

    normalize(m.forane).includes(q)

  );

}


function filterPriests(){

  displayCurrentStatus();

}


/* =========================================================
   DISPLAY CARDS
========================================================= */

function display(priests){

  listEl.innerHTML = '';

  countEl.textContent =
    `Total: ${priests.length}`;


  if(priests.length === 0){

    let message =
      'No priests found.';

    if(currentStatus === 'Active'){
      message =
        'No active priests found.';
    }

    if(currentStatus === 'Retired'){
      message =
        'No retired priests found.';
    }

    if(currentStatus === 'Demised'){
      message =
        'No demised priests found.';
    }


    listEl.innerHTML = `

      <li class="empty-state">

        <div class="empty-state-icon">
          ${currentStatus === 'Demised' ? '✝' : '⌕'}
        </div>

        <h3>${message}</h3>

        <p>
          Try another name, parish or home parish.
        </p>

      </li>

    `;

    return;
  }


  priests.forEach(p => {

    const hasRecent =
      p.status === 'Active' &&
      p.ministries.some(
        m => isRecent(m.join_date)
      );


    const prefix =
      p.ministries.find(
        m => m.primary
      )?.name_prefix || 'Fr.';


    const homeParish =
      getHomeParish(p);


    /* =========================================
       DEMISED
    ========================================= */

    if(p.status === 'Demised'){

      const li =
        document.createElement('li');

      li.className =
        'priest-item demised-card';


      li.innerHTML = `

        <div class="demised-flower">
          ✿
        </div>

        <img
          src="${fixPhoto(p.photo)}"
          alt="${escapeHtml(p.name)}">

        <div class="priest-info">

          <h3>
            ${prefix}
            ${escapeHtml(p.name)}
          </h3>

          ${
            p.nickname
              ? `<p class="nickname">
                   ${escapeHtml(p.nickname)}
                 </p>`
              : ''
          }

          <span class="status-badge demised">
            ✝ Demised
          </span>


          <div class="demised-details">

            <div class="detail-row">

              <span class="detail-label">
                Birth:
              </span>

              <span class="detail-value">
                ${
                  formatDate(
                    p.date_of_birth
                  ) || 'Not available'
                }
              </span>

            </div>


            <div class="detail-row">

              <span class="detail-label">
                Ordination:
              </span>

              <span class="detail-value">
                ${
                  formatDate(
                    p.date_of_ordination
                  ) || 'Not available'
                }
              </span>

            </div>


            <div class="detail-row">

              <span class="detail-label">
                Death:
              </span>

              <span class="detail-value death-value">
                ${
                  formatDate(
                    p.demisedate
                  ) || 'Not available'
                }
              </span>

            </div>

          </div>


          ${
            homeParish
              ? `

                <div class="home-parish">

                  <div class="home-parish-label">
                    Home Parish
                  </div>

                  <div class="home-parish-value">
                    ${escapeHtml(homeParish)}
                  </div>

                </div>

              `
              : ''
          }

        </div>

      `;


      listEl.appendChild(li);

      return;
    }


    /* =========================================
       ACTIVE / RETIRED
    ========================================= */

    const ministriesHtml =
      p.ministries.map(m => `

        <div class="ministry-block">

          <div class="designation">
            ${escapeHtml(m.designation)}
          </div>

          <div class="parish">
            ${escapeHtml(m.parish)},
            ${escapeHtml(m.place)}
          </div>

          ${
            m.forane
              ? `
                <div class="forane">
                  ${escapeHtml(m.forane)}
                </div>
              `
              : ''
          }

          ${
            m.join_date
              ? `
                <div class="appointment-date">
                  Appointed
                  ${formatDate(m.join_date)}
                </div>
              `
              : ''
          }

        </div>

      `).join('');


    const li =
      document.createElement('li');


    li.className =
      'priest-item' +
      (
        hasRecent
          ? ' recent-appointment'
          : ''
      );


    li.innerHTML = `

      ${
        hasRecent
          ? `
            <div
              class="seal"
              title="Recently appointed">
            </div>

            <div class="seal-label">
              New
            </div>
          `
          : ''
      }


      <img
        src="${fixPhoto(p.photo)}"
        alt="${escapeHtml(p.name)}">


      <div class="priest-info">

        <h3>
          ${prefix}
          ${escapeHtml(p.name)}
        </h3>


        ${
          p.nickname
            ? `
              <p class="nickname">
                ${escapeHtml(p.nickname)}
              </p>
            `
            : ''
        }


        <span
          class="status-badge
          ${
            p.status === 'Retired'
              ? 'retired'
              : 'active'
          }">

          ${
            p.status === 'Retired'
              ? 'Retired'
              : 'Active'
          }

        </span>


        ${
          ministriesHtml
            ? ministriesHtml
            : `
              <div class="ministry-block">

                <div class="parish">
                  No current ministry listed
                </div>

              </div>
            `
        }


        ${
          homeParish
            ? `

              <div class="home-parish">

                <div class="home-parish-label">
                  Home Parish
                </div>

                <div class="home-parish-value">
                  ${escapeHtml(homeParish)}
                </div>

              </div>

            `
            : ''
        }

      </div>

    `;


    listEl.appendChild(li);

  });

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =========================================================
   TIMELINE
========================================================= */

function renderTimeline(priests){

  const timelineList =
    document.getElementById(
      'timeline-list'
    );

  timelineList.innerHTML = '';


  const anyHistory =
    priests.some(
      p =>
        p.timeline.some(
          m => !m.is_current
        )
    );


  if(!anyHistory){

    const notice =
      document.createElement('div');

    notice.className =
      'timeline-empty-notice';

    notice.innerHTML = `

      No past-assignment history was found
      in the current data — only current
      postings are available.

    `;

    timelineList.appendChild(notice);

  }


  priests.forEach(p => {

    if(p.timeline.length === 0){
      return;
    }


    const entriesHtml =
      p.timeline.map(m => `

        <div
          class="timeline-entry
          ${m.is_current ? 'is-current' : ''}">

          <div class="timeline-entry-designation">

            ${escapeHtml(m.designation)}

            ${
              m.is_current
                ? `
                  <span
                    class="timeline-current-tag">
                    Present
                  </span>
                `
                : ''
            }

          </div>


          <div class="timeline-entry-parish">

            ${escapeHtml(m.parish)},
            ${escapeHtml(m.place)}

          </div>


          <div class="timeline-entry-dates">

            ${
              m.join_date
                ? formatDate(m.join_date)
                : 'Date unknown'
            }

            –

            ${
              m.is_current
                ? 'Present'
                : (
                    m.end_date
                      ? formatDate(m.end_date)
                      : 'Date unknown'
                  )
            }

          </div>

        </div>

      `).join('');


    const li =
      document.createElement('li');

    li.className =
      'timeline-person';


    li.innerHTML = `

      <img
        src="${fixPhoto(p.photo)}"
        alt="${escapeHtml(p.name)}">


      <div
        style="flex:1;min-width:0;">

        <p class="timeline-person-name">

          ${escapeHtml(p.name)}

        </p>


        <div class="timeline-track">

          ${entriesHtml}

        </div>


        ${
          getHomeParish(p)
            ? `

              <div class="home-parish">

                <div class="home-parish-label">
                  Home Parish
                </div>

                <div class="home-parish-value">
                  ${escapeHtml(
                    getHomeParish(p)
                  )}
                </div>

              </div>

            `
            : ''
        }

      </div>

    `;


    timelineList.appendChild(li);

  });

}


/* =========================================================
   TIMELINE SEARCH
========================================================= */

function filterTimeline(){

  const q =
    normalize(
      document.getElementById(
        'timeline-search-bar'
      ).value
    );


  const filtered =
    allPriests.filter(p => {

      if(!q){
        return true;
      }

      return (

        normalize(p.name).includes(q) ||

        normalize(p.nickname).includes(q) ||

        normalize(p.nativeparish).includes(q) ||

        normalize(p.nativeparishplace).includes(q) ||

        normalize(
          getHomeParish(p)
        ).includes(q)

      );

    });


  renderTimeline(filtered);

}


/* =========================================================
   MAIN TABS
========================================================= */

function switchMainTab(tab){

  document
    .getElementById('tab-directory')
    .classList.toggle(
      'active',
      tab === 'directory'
    );

  document
    .getElementById('tab-timeline')
    .classList.toggle(
      'active',
      tab === 'timeline'
    );


  document
    .getElementById('tab-btn-directory')
    .classList.toggle(
      'active',
      tab === 'directory'
    );

  document
    .getElementById('tab-btn-timeline')
    .classList.toggle(
      'active',
      tab === 'timeline'
    );

}


/* =========================================================
   START
========================================================= */

loadData();

</script>

</body>
</html>
